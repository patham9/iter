<!doctype html>
<meta charset="utf-8">
<title>Iter Browser</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0d0f12;
    --panel:#14171c;
    --panel2:#191d23;
    --line:#2a3038;
    --text:#e5e7eb;
    --muted:#8b949e;
    --accent:#7aa2f7;
    --user:#22314f;
    --iter:#1c3329;
  }
  * { box-sizing:border-box }
  html, body { height:100%; margin:0 }
  body {
    background:var(--bg); color:var(--text);
    font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden;
  }
  button, input, textarea { font:inherit }
  button {
    background:#20252c; color:var(--text); border:1px solid #3a424c;
    border-radius:6px; padding:6px 10px; cursor:pointer;
  }
  button:hover { background:#292f38 }
  button:disabled { opacity:.45; cursor:default }
  input, textarea {
    background:#101318; color:var(--text); border:1px solid #343b45;
    border-radius:6px; outline:none;
  }
  input:focus, textarea:focus { border-color:#5979b8 }

  #app { height:100%; display:flex; flex-direction:column; min-height:0 }
  #bar {
    display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    padding:8px; background:#101318; border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  #bar input { padding:6px 8px }
  #endpoint { width:260px; flex:1 1 230px; max-width:400px }
  #model { width:320px; flex:1 1 260px; max-width:480px }
  #key { width:120px }
  #remember-label { color:var(--muted); white-space:nowrap; user-select:none }
  #remember-key { vertical-align:middle; margin-right:4px }

  #chat-shell {
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
    width:min(980px,100%); margin:0 auto; padding:0 14px;
  }
  #chat {
    flex:1 1 auto; min-height:0; overflow:auto;
    padding:18px 0 10px;
  }
  .chat-empty {
    color:var(--muted); text-align:center; margin-top:12vh; line-height:1.8;
  }
  .msg { display:flex; margin:8px 0 }
  .msg.user { justify-content:flex-end }
  .msg.iter { justify-content:flex-start }
  .bubble {
    max-width:min(78%,760px); white-space:pre-wrap; word-break:break-word;
    padding:10px 12px; border:1px solid var(--line); border-radius:12px;
    line-height:1.45;
  }
  .user .bubble { background:var(--user); border-bottom-right-radius:3px }
  .iter .bubble { background:var(--iter); border-bottom-left-radius:3px }
  .msg-meta { color:var(--muted); font-size:11px; margin-bottom:4px }

  #chat-compose {
    flex:0 0 auto; display:flex; gap:8px; padding:10px 0 12px;
    border-top:1px solid var(--line);
  }
  #chat-input { flex:1; padding:10px 12px }
  #send-chat { min-width:78px }

  details.drawer {
    flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel);
  }
  details.drawer > summary {
    cursor:pointer; user-select:none; list-style:none;
    padding:7px 12px; color:#c9d1d9; background:#11151a;
  }
  details.drawer > summary::-webkit-details-marker { display:none }
  details.drawer > summary::before { content:"▸ "; color:var(--muted) }
  details.drawer[open] > summary::before { content:"▾ " }

  #workspace {
    height:min(42vh,390px); min-height:220px;
    display:grid; grid-template-columns:210px minmax(260px,1fr) minmax(320px,1.25fr);
    border-top:1px solid var(--line);
  }
  #files-pane, #editor-pane, #terminal-pane {
    min-width:0; min-height:0; display:flex; flex-direction:column;
  }
  #files-pane, #editor-pane { border-right:1px solid var(--line) }
  .pane-head {
    height:34px; flex:0 0 34px; display:flex; align-items:center; gap:6px;
    padding:4px 7px; border-bottom:1px solid var(--line); color:var(--muted);
    background:var(--panel2);
  }
  .pane-head .grow {
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mini { padding:3px 7px; font-size:12px }
  #file-tree {
    flex:1; overflow:auto; padding:6px;
  }
  .tree-row {
    display:block; width:100%; text-align:left; border:0; border-radius:3px;
    background:transparent; padding:2px 4px; color:#c9d1d9;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tree-row:hover { background:#222831 }
  .tree-dir { color:#9db7e5 }
  .tree-selected { background:#273244 !important }
  #file-editor-wrap {
    position:relative; flex:1; min-height:0; overflow:hidden; background:#101318;
  }
  #file-editor, #file-highlight {
    position:absolute; inset:0; margin:0; width:100%; height:100%;
    border:0; border-radius:0; padding:9px 10px; line-height:1.4;
    white-space:pre; tab-size:4; font:inherit;
  }
  #file-editor {
    resize:none; z-index:2; background:#101318; color:var(--text);
  }
  #file-highlight {
    z-index:1; overflow:auto; pointer-events:none; color:var(--text);
    background:#101318;
  }
  #file-highlight::-webkit-scrollbar { display:none }
  #file-highlight { scrollbar-width:none }
  #file-editor-wrap.highlighting #file-editor {
    background:transparent; color:transparent; caret-color:var(--text);
  }
  #file-editor-wrap.highlighting #file-editor::selection {
    background:rgba(122,162,247,.28); color:transparent;
  }
  .syn-comment { color:#7d8590 }
  .syn-string { color:#a5d6ff }
  .syn-keyword { color:#ff7b72 }
  .syn-number { color:#79c0ff }
  .syn-literal { color:#d2a8ff }
  .syn-decorator { color:#ffa657 }
  .syn-json-key { color:#7ee787 }
  .syn-metta-command { color:#ff7b72; font-weight:700 }
  .syn-paren-0 { color:#79c0ff }
  .syn-paren-1 { color:#d2a8ff }
  .syn-paren-2 { color:#ffa657 }
  .syn-paren-3 { color:#7ee787 }
  .syn-paren-4 { color:#a5d6ff }
  .syn-paren-5 { color:#ff7b72 }
  .syn-tag { color:#7ee787 }
  .syn-attr { color:#79c0ff }
  .syn-punct { color:#8b949e }
  .syn-js-keyword { color:#ff7b72 }
  .syn-js-builtin { color:#d2a8ff }
  #terminal-output, #activity {
    flex:1; min-height:0; overflow:auto; margin:0; white-space:pre-wrap;
    padding:8px 10px; color:#d7dce2;
  }
  #terminal-output { background:#0c0f12 }
  #terminal-compose {
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    border-top:1px solid var(--line); background:#0c0f12; padding:5px 8px;
  }
  #terminal-prompt { color:#7ee787 }
  #terminal-input {
    flex:1; border:0; background:transparent; padding:4px 0; border-radius:0;
  }

  #activity {
    height:min(29vh,280px); background:#0b0d10; border-top:1px solid var(--line);
    color:#aeb6c0;
  }
  #status {
    margin-left:auto; color:var(--muted); font-size:12px;
  }
  #status.running { color:#7ee787 }
  #status.stopped { color:#8b949e }

  @media (max-width:900px) {
    #workspace { grid-template-columns:180px 1fr; }
    #terminal-pane { grid-column:1 / -1; border-top:1px solid var(--line); min-height:150px }
    #workspace { height:55vh; grid-template-rows:1fr 170px }
  }
</style>

<div id="app">
  <div id="bar">
    <input id="endpoint" value="https://openrouter.ai/api/v1" title="OpenAI-compatible base URL">
    <input id="model" value="z-ai/glm-5.2" title="model">
    <input id="key" value="dummy" type="password" title="API key">
    <label id="remember-label" title="Store API key in this browser's localStorage">
      <input id="remember-key" type="checkbox">remember key
    </label>
    <button id="start" disabled>Start Iter</button>
    <button id="stop" disabled>Stop</button>
    <button id="export-app" title="Download /work and UI settings as a ZIP">Export</button>
    <button id="import-app" title="Replace /work and UI settings from a ZIP">Import</button>
    <button id="reset-app" title="Delete persisted filesystem and settings, then reload">Reset</button>
    <input id="import-file" type="file" accept=".zip,application/zip" hidden>
  </div>

  <section id="chat-shell">
    <div id="chat">
      <div class="chat-empty" id="chat-empty">Iter browser<br>Messages stay here; runtime noise stays below.</div>
    </div>
    <div id="chat-compose">
      <input id="chat-input" disabled autocomplete="off" spellcheck="false" placeholder="Message Iter">
      <button id="send-chat" disabled>Send</button>
    </div>
  </section>

  <details class="drawer" id="workspace-drawer" open>
    <summary>Terminal &amp; Files <span id="workspace-summary"></span></summary>
    <div id="workspace">
      <section id="files-pane">
        <div class="pane-head"><span class="grow">/work</span><button class="mini" id="refresh-files">↻</button></div>
        <div id="file-tree"></div>
      </section>
      <section id="editor-pane">
        <div class="pane-head">
          <span class="grow" id="file-path">Select a file</span>
          <button class="mini" id="save-file" disabled>Save</button>
        </div>
        <div id="file-editor-wrap">
          <pre id="file-highlight" aria-hidden="true"></pre>
          <textarea id="file-editor" disabled spellcheck="false"></textarea>
        </div>
      </section>
      <section id="terminal-pane">
        <div class="pane-head"><span class="grow">just-bash</span><span>/work</span></div>
        <pre id="terminal-output">$ </pre>
        <div id="terminal-compose">
          <span id="terminal-prompt">$</span>
          <input id="terminal-input" disabled autocomplete="off" spellcheck="false">
        </div>
      </section>
    </div>
  </details>

  <details class="drawer" id="activity-drawer">
    <summary>System Activity <span id="status" class="stopped">loading</span></summary>
    <pre id="activity">loading MicroPython...</pre>
  </details>
</div>

<script type="module">
import * as MP from "https://cdn.jsdelivr.net/npm/@micropython/micropython-webassembly-pyscript@1.28.0-6/micropython.mjs";
import { Bash, defineCommand } from "https://esm.sh/just-bash@3.4.2?bundle";
import html2canvas from "https://esm.sh/html2canvas@1.4.1";
import JSZip from "https://esm.sh/jszip@3.10.1";

const activity = document.querySelector('#activity');
const term = activity; // compatibility: existing out() calls are system activity
const chat = document.querySelector('#chat');
const chatEmpty = document.querySelector('#chat-empty');
const chatInput = document.querySelector('#chat-input');
const sendChat = document.querySelector('#send-chat');
const input = chatInput; // compatibility for existing focus/status helpers
const terminalOutput = document.querySelector('#terminal-output');
const terminalInput = document.querySelector('#terminal-input');
const fileTree = document.querySelector('#file-tree');
const fileEditorWrap = document.querySelector('#file-editor-wrap');
const fileHighlight = document.querySelector('#file-highlight');
const fileEditor = document.querySelector('#file-editor');
const filePath = document.querySelector('#file-path');
const saveFile = document.querySelector('#save-file');
const refreshFiles = document.querySelector('#refresh-files');
const workspaceDrawer = document.querySelector('#workspace-drawer');
const activityDrawer = document.querySelector('#activity-drawer');
const status = document.querySelector('#status');
const start = document.querySelector('#start');
const stop = document.querySelector('#stop');
const exportApp = document.querySelector('#export-app');
const importApp = document.querySelector('#import-app');
const importFile = document.querySelector('#import-file');
const resetApp = document.querySelector('#reset-app');
const endpoint = document.querySelector('#endpoint');
const model = document.querySelector('#model');
const key = document.querySelector('#key');
const rememberKey = document.querySelector('#remember-key');
const enc = new TextEncoder(), dec = new TextDecoder();
let terminalCwd = "/work";
let terminalHistory = [];
let terminalHistoryIndex = 0;
let terminalHistoryDraft = "";
const inbox = [];
let mp, iterRunning = false, stopRequested = false;
let bashFs = null, pyCapture = null;

const out = s => {
  activity.textContent += String(s);
  const lines = activity.textContent.split("\n");
  if(lines.length > 1000)
    activity.textContent = lines.slice(lines.length - 1000).join("\n");
  activity.scrollTop = activity.scrollHeight;
};

function terminalOut(s) {
  terminalOutput.textContent += String(s);
  terminalOutput.scrollTop = terminalOutput.scrollHeight;
}

const CHAT_PATH = '/work/iter/chat.txt';

function appendChatRecord(role, text, channel) {
  if(!mp) return;
  const record = JSON.stringify({
    time: new Date().toISOString(),
    role: role,
    channel: channel || 'terminal',
    text: String(text)
  }) + '\n';
  let existing = '';
  try { existing = read(CHAT_PATH); } catch {}
  write(CHAT_PATH, existing + record);
  persist();
}

function addChat(role, text, channel='terminal', save=true) {
  if(chatEmpty) chatEmpty.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'iter');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = (role === 'user' ? 'You' : 'Iter') + (channel && channel !== 'terminal' ? ' · ' + channel : '');

  const body = document.createElement('div');
  body.textContent = String(text);

  bubble.append(meta, body);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;

  if(save) appendChatRecord(role, text, channel);
}

function setStatus(text, running=false) {
  status.textContent = text;
  status.className = running ? 'running' : 'stopped';
}

const norm = p => {
  const a=[]; for(const x of String(p).split('/')) { if(!x||x==='.') continue; if(x==='..') a.pop(); else a.push(x); }
  return '/' + a.join('/');
};
const path = p => p && String(p).startsWith('/') ? norm(p) : norm(mp.FS.cwd() + '/' + (p || ''));
const exists = p => { try { mp.FS.stat(path(p)); return true; } catch { return false; } };
const read = p => dec.decode(mp.FS.readFile(path(p)));
const write = (p,s) => mp.FS.writeFile(path(p), enc.encode(String(s)));
function mkdirp(p) {
  let cur=''; for(const x of norm(p).split('/').filter(Boolean)) { cur += '/' + x; try { mp.FS.mkdir(cur); } catch {} }
}

let selectedFile = null;
let fileRefreshTimer = null;

function scheduleFileRefresh() {
  clearTimeout(fileRefreshTimer);
  fileRefreshTimer = setTimeout(() => {
    if(mp && workspaceDrawer.open) refreshFileTree();
  }, 180);
}

function fileKind(p) {
  try {
    const st = mp.FS.stat(p);
    return mp.FS.isDir(st.mode) ? 'dir' : 'file';
  } catch { return null; }
}

function renderDirectory(dir, host, depth=0) {
  let names;
  try { names = mp.FS.readdir(dir).filter(n => n !== '.' && n !== '..').sort(); }
  catch { return; }

  names.sort((a,b) => {
    const pa=(dir==='/'?'':dir)+'/'+a, pb=(dir==='/'?'':dir)+'/'+b;
    const da=fileKind(pa)==='dir', db=fileKind(pb)==='dir';
    return da===db ? a.localeCompare(b) : (da ? -1 : 1);
  });

  for(const name of names) {
    const p = (dir === '/' ? '' : dir) + '/' + name;
    const kind = fileKind(p);

    if(kind === 'dir') {
      const details = document.createElement('details');
      details.open = depth < 1;
      const summary = document.createElement('summary');
      summary.className = 'tree-row tree-dir';
      summary.textContent = name + '/';
      details.appendChild(summary);
      const children = document.createElement('div');
      children.style.paddingLeft = '11px';
      details.appendChild(children);
      details.addEventListener('toggle', () => {
        if(details.open && !children.dataset.loaded) {
          children.dataset.loaded = '1';
          renderDirectory(p, children, depth+1);
        }
      });
      if(details.open) {
        children.dataset.loaded = '1';
        renderDirectory(p, children, depth+1);
      }
      host.appendChild(details);
    } else if(kind === 'file') {
      const btn = document.createElement('button');
      btn.className = 'tree-row' + (selectedFile === p ? ' tree-selected' : '');
      btn.textContent = name;
      btn.title = p;
      btn.onclick = () => openFileInEditor(p);
      host.appendChild(btn);
    }
  }
}

function refreshFileTree() {
  if(!mp) return;
  fileTree.textContent = '';
  renderDirectory('/work', fileTree, 0);
}

const FILE_HIGHLIGHT_LIMIT = 500000;
const JSON_PRETTY_LIMIT = 2000000;

function escapeFileHtml(text) {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

const PY_KEYWORDS = new Set([
  'and','as','assert','async','await','break','class','continue','def','del',
  'elif','else','except','finally','for','from','global','if','import','in',
  'is','lambda','nonlocal','not','or','pass','raise','return','try','while',
  'with','yield'
]);

function highlightPython(text) {
  const tokenRe = /("{3}[\s\S]*?"{3}|'{3}[\s\S]*?'{3}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#[^\n]*|@[A-Za-z_]\w*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b)/g;
  let output = '';
  let last = 0;
  let match;

  while((match = tokenRe.exec(text))) {
    output += escapeFileHtml(text.slice(last, match.index));
    const token = match[0];
    let cls = '';

    if(token.startsWith('#')) cls = 'syn-comment';
    else if(token.startsWith('"') || token.startsWith("'")) cls = 'syn-string';
    else if(token.startsWith('@')) cls = 'syn-decorator';
    else if(/^\d/.test(token)) cls = 'syn-number';
    else if(PY_KEYWORDS.has(token)) cls = 'syn-keyword';
    else if(token === 'True' || token === 'False' || token === 'None') cls = 'syn-literal';

    output += cls
      ? '<span class="' + cls + '">' + escapeFileHtml(token) + '</span>'
      : escapeFileHtml(token);

    last = match.index + token.length;
  }

  return output + escapeFileHtml(text.slice(last));
}

function highlightJson(text) {
  const tokenRe = /"(?:\\.|[^"\\])*"(?=\s*:)|"(?:\\.|[^"\\])*"|\b(?:true|false|null)\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/g;
  let output = '';
  let last = 0;
  let match;

  while((match = tokenRe.exec(text))) {
    output += escapeFileHtml(text.slice(last, match.index));
    const token = match[0];
    let cls = 'syn-number';

    if(token.startsWith('"')) {
      const rest = text.slice(match.index + token.length);
      cls = /^\s*:/.test(rest) ? 'syn-json-key' : 'syn-string';
    } else if(token === 'true' || token === 'false' || token === 'null') {
      cls = 'syn-literal';
    }

    output += '<span class="' + cls + '">' + escapeFileHtml(token) + '</span>';
    last = match.index + token.length;
  }

  return output + escapeFileHtml(text.slice(last));
}

function highlightMetta(text) {
  let output = '';
  let depth = 0;
  let inString = false;
  let escaped = false;
  let inComment = false;

  for(let i = 0; i < text.length; i++) {
    const ch = text[i];

    if(inComment) {
      if(ch === '\n') {
        inComment = false;
        output += '\n';
      } else {
        output += '<span class="syn-comment">' + escapeFileHtml(ch) + '</span>';
      }
      continue;
    }

    if(inString) {
      output += escapeFileHtml(ch);
      if(escaped) escaped = false;
      else if(ch === '\\') escaped = true;
      else if(ch === '"') inString = false;
      continue;
    }

    if(ch === '"') {
      inString = true;
      output += escapeFileHtml(ch);
      continue;
    }

    if(ch === ';') {
      inComment = true;
      output += '<span class="syn-comment">;</span>';
      continue;
    }

    if(ch === '!') {
      output += '<span class="syn-metta-command">!</span>';
      continue;
    }

    if(ch === '(') {
      const cls = 'syn-paren-' + (depth % 6);
      output += '<span class="' + cls + '">(</span>';
      depth++;
      continue;
    }

    if(ch === ')') {
      depth = Math.max(0, depth - 1);
      const cls = 'syn-paren-' + (depth % 6);
      output += '<span class="' + cls + '">)</span>';
      continue;
    }

    output += escapeFileHtml(ch);
  }

  return output;
}

const JS_KEYWORDS = new Set([
  'as','async','await','break','case','catch','class','const','continue',
  'debugger','default','delete','do','else','export','extends','finally',
  'for','from','function','get','if','import','in','instanceof','let','new',
  'of','return','set','static','super','switch','throw','try','typeof','var',
  'void','while','with','yield'
]);

const JS_BUILTINS = new Set([
  'Array','Boolean','Date','Error','Function','JSON','Map','Math','Number',
  'Object','Promise','RegExp','Set','String','Symbol','URL','URLSearchParams',
  'console','document','globalThis','window'
]);

function highlightJavaScript(text) {
  const tokenRe = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|\b[A-Za-z_$][A-Za-z0-9_$]*\b)/g;
  let output = '';
  let last = 0;
  let match;

  while((match = tokenRe.exec(text))) {
    output += escapeFileHtml(text.slice(last, match.index));
    const token = match[0];
    let cls = '';

    if(token.startsWith('//') || token.startsWith('/*')) cls = 'syn-comment';
    else if(token.startsWith('"') || token.startsWith("'") || token.startsWith('`')) cls = 'syn-string';
    else if(/^\d/.test(token)) cls = 'syn-number';
    else if(JS_KEYWORDS.has(token)) cls = 'syn-js-keyword';
    else if(token === 'true' || token === 'false' || token === 'null' ||
            token === 'undefined' || token === 'NaN' || token === 'Infinity')
      cls = 'syn-literal';
    else if(JS_BUILTINS.has(token)) cls = 'syn-js-builtin';

    output += cls
      ? '<span class="' + cls + '">' + escapeFileHtml(token) + '</span>'
      : escapeFileHtml(token);

    last = match.index + token.length;
  }

  return output + escapeFileHtml(text.slice(last));
}

function highlightHtmlTag(raw) {
  if(raw.startsWith('<!--'))
    return '<span class="syn-comment">' + escapeFileHtml(raw) + '</span>';

  if(/^<!doctype\b/i.test(raw))
    return '<span class="syn-tag">' + escapeFileHtml(raw) + '</span>';

  const opening = raw.match(/^<(\/?)([A-Za-z][A-Za-z0-9:_-]*)/);
  if(!opening)
    return escapeFileHtml(raw);

  let output =
    '<span class="syn-punct">&lt;' +
    escapeFileHtml(opening[1]) +
    '</span>' +
    '<span class="syn-tag">' +
    escapeFileHtml(opening[2]) +
    '</span>';

  let i = opening[0].length;

  while(i < raw.length) {
    const ch = raw[i];

    if(ch === '>') {
      output += '<span class="syn-punct">&gt;</span>';
      i++;
      continue;
    }

    if(ch === '/' && raw[i + 1] === '>') {
      output += '<span class="syn-punct">/&gt;</span>';
      i += 2;
      continue;
    }

    if(/\s/.test(ch)) {
      output += escapeFileHtml(ch);
      i++;
      continue;
    }

    if(ch === '"' || ch === "'") {
      const quote = ch;
      let end = i + 1;
      let escaped = false;

      while(end < raw.length) {
        const current = raw[end];
        if(escaped) {
          escaped = false;
        } else if(current === '\\') {
          escaped = true;
        } else if(current === quote) {
          end++;
          break;
        }
        end++;
      }

      output +=
        '<span class="syn-string">' +
        escapeFileHtml(raw.slice(i, end)) +
        '</span>';
      i = end;
      continue;
    }

    if(ch === '=') {
      output += '<span class="syn-punct">=</span>';
      i++;
      continue;
    }

    const attr = raw.slice(i).match(/^[A-Za-z_:][A-Za-z0-9:_.-]*/);
    if(attr) {
      output +=
        '<span class="syn-attr">' +
        escapeFileHtml(attr[0]) +
        '</span>';
      i += attr[0].length;
      continue;
    }

    output += escapeFileHtml(ch);
    i++;
  }

  return output;
}

function highlightHtml(text) {
  let output = '';
  let plainStart = 0;
  let i = 0;

  while(i < text.length) {
    if(text.startsWith('<!--', i)) {
      output += escapeFileHtml(text.slice(plainStart, i));
      const end = text.indexOf('-->', i + 4);
      const stop = end < 0 ? text.length : end + 3;
      output +=
        '<span class="syn-comment">' +
        escapeFileHtml(text.slice(i, stop)) +
        '</span>';
      i = stop;
      plainStart = i;
      continue;
    }

    if(text[i] !== '<') {
      i++;
      continue;
    }

    const next = text[i + 1] || '';
    const looksLikeTag =
      /[A-Za-z]/.test(next) ||
      next === '/' ||
      text.slice(i, i + 9).toLowerCase() === '<!doctype';

    if(!looksLikeTag) {
      i++;
      continue;
    }

    let j = i + 1;
    let quote = '';
    let escaped = false;

    while(j < text.length) {
      const ch = text[j];

      if(quote) {
        if(escaped) {
          escaped = false;
        } else if(ch === '\\') {
          escaped = true;
        } else if(ch === quote) {
          quote = '';
        }
      } else if(ch === '"' || ch === "'") {
        quote = ch;
      } else if(ch === '>') {
        j++;
        break;
      }

      j++;
    }

    if(j > text.length || text[j - 1] !== '>') {
      i++;
      continue;
    }

    output += escapeFileHtml(text.slice(plainStart, i));
    output += highlightHtmlTag(text.slice(i, j));
    i = j;
    plainStart = i;
  }

  return output + escapeFileHtml(text.slice(plainStart));
}

function editorLanguageForPath(p) {
  const lower = String(p || '').toLowerCase();
  if(lower.endsWith('.py')) return 'python';
  if(lower.endsWith('.json')) return 'json';
  if(lower.endsWith('.metta')) return 'metta';
  if(lower.endsWith('.html') || lower.endsWith('.htm')) return 'html';
  if(lower.endsWith('.js') || lower.endsWith('.mjs') || lower.endsWith('.cjs')) return 'javascript';
  return '';
}

function updateFileHighlight() {
  const lang = fileEditor.dataset.language || '';

  if(!lang || fileEditor.value.length > FILE_HIGHLIGHT_LIMIT) {
    fileEditorWrap.classList.remove('highlighting');
    fileHighlight.textContent = '';
    return;
  }

  fileEditorWrap.classList.add('highlighting');
  fileHighlight.innerHTML =
    lang === 'python'
      ? highlightPython(fileEditor.value)
      : lang === 'json'
        ? highlightJson(fileEditor.value)
        : lang === 'metta'
          ? highlightMetta(fileEditor.value)
          : lang === 'html'
            ? highlightHtml(fileEditor.value)
            : highlightJavaScript(fileEditor.value);

  fileHighlight.scrollTop = fileEditor.scrollTop;
  fileHighlight.scrollLeft = fileEditor.scrollLeft;
}

function openFileInEditor(p) {
  selectedFile = p;
  filePath.textContent = p;
  try {
    const bytes = new Uint8Array(mp.FS.readFile(p));
    const looksBinary = bytes.some((b,i) => i < 4096 && b === 0);

    if(looksBinary) {
      fileEditor.dataset.language = '';
      fileEditor.value = '[binary file: ' + bytes.length + ' bytes]';
      fileEditor.disabled = true;
      saveFile.disabled = true;
    } else {
      let text = dec.decode(bytes);
      const language = editorLanguageForPath(p);

      if(language === 'json' && bytes.length <= JSON_PRETTY_LIMIT) {
        try {
          text = JSON.stringify(JSON.parse(text), null, 2);
        } catch {}
      }

      fileEditor.dataset.language = language;
      fileEditor.value = text;
      fileEditor.disabled = false;
      saveFile.disabled = false;
    }
  } catch(e) {
    fileEditor.dataset.language = '';
    fileEditor.value = '[could not read file: ' + String(e?.message ?? e) + ']';
    fileEditor.disabled = true;
    saveFile.disabled = true;
  }

  fileEditor.scrollTop = 0;
  fileEditor.scrollLeft = 0;
  updateFileHighlight();

  for(const row of fileTree.querySelectorAll('.tree-row')) {
    row.classList.toggle('tree-selected', row.title === p);
  }
}

function restoreChat() {
  if(exists(CHAT_PATH)) {
    try {
      for(const line of read(CHAT_PATH).split('\n')) {
        if(!line.trim()) continue;
        const item = JSON.parse(line);
        if((item.role === 'user' || item.role === 'iter') && typeof item.text === 'string')
          addChat(item.role, item.text, item.channel || 'terminal', false);
      }
      return;
    } catch(e) {
      console.warn('chat transcript restore failed', e);
    }
  }

  // One-time migration for older builds that only had experience.json.
  if(!exists('/work/iter/experience.json')) return;
  try {
    const exp = JSON.parse(read('/work/iter/experience.json'));
    for(const m of exp) {
      if(m?.role === 'user' && typeof m.content === 'string') {
        const match = m.content.match(/^Step .*: \[terminal\] ([\s\S]*)$/);
        if(match) addChat('user', match[1], 'terminal', true);
      }
      if(m?.role === 'assistant' && Array.isArray(m.tool_calls)) {
        for(const call of m.tool_calls) {
          if(call?.function?.name !== 'send') continue;
          try {
            const args = JSON.parse(call.function.arguments || '{}');
            if(typeof args.message === 'string')
              addChat('iter', args.message, args.channel || 'terminal', true);
          } catch {}
        }
      }
    }
  } catch(e) {
    console.warn('chat history migration failed', e);
  }
}

const SETTINGS_KEY = 'iter-browser-settings-v1';
const UI_KEY = 'iter-browser-ui-v1';

function bytesToBase64(bytes) {
  let binary = '';
  const chunk = 0x8000;
  for(let i=0; i<bytes.length; i+=chunk)
    binary += String.fromCharCode(...bytes.subarray(i, i+chunk));
  return btoa(binary);
}

function base64ToBytes(text) {
  const binary = atob(String(text));
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function safeZipRelativePath(name) {
  name = String(name).replace(/\\/g, "/");
  while(name.startsWith("/")) name = name.slice(1);
  const parts = [];
  for(const part of name.split("/")) {
    if(!part || part === ".") continue;
    if(part === "..") throw new Error("ZIP contains an unsafe path: " + name);
    parts.push(part);
  }
  return parts.join("/");
}

async function exportPortableState() {
  if(!mp) throw new Error("MicroPython is not ready");

  saveSettings();
  saveUiState();
  persist();

  const zip = new JSZip();
  const work = zip.folder("work");
  const browser = zip.folder("browser");

  function walk(dir, rel="") {
    const names = mp.FS.readdir(dir).filter(n => n !== "." && n !== "..");
    if(!names.length && rel) work.folder(rel);

    for(const name of names) {
      const p = (dir === "/" ? "" : dir) + "/" + name;
      const childRel = rel ? rel + "/" + name : name;
      const st = mp.FS.stat(p);

      if(mp.FS.isDir(st.mode)) {
        work.folder(childRel);
        walk(p, childRel);
      } else {
        work.file(childRel, new Uint8Array(mp.FS.readFile(p)), { binary: true });
      }
    }
  }

  walk("/work");

  const browserStorage = {};
  for(let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if(!k || !k.startsWith("iter-browser-")) continue;
    if(k === FSKEY || k === "iter-browser-verbatim-import") continue;
    browserStorage[k] = localStorage.getItem(k);
  }
  browser.file("localStorage.json", JSON.stringify(browserStorage, null, 2));

  const blob = await zip.generateAsync({
    type: "blob",
    compression: "DEFLATE",
    compressionOptions: { level: 6 }
  });

  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "iter-browser-" + stamp + ".zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function importPortableState(file) {
  if(!file) return;

  const zip = await JSZip.loadAsync(file);
  const entries = [];

  for(const [rawName, entry] of Object.entries(zip.files)) {
    const name = safeZipRelativePath(rawName);
    if(name) entries.push({ rawName, name, entry });
  }

  // Direct export has work/ and browser/. Also tolerate one outer wrapper.
  let prefix = "";
  const rootHasWork = entries.some(x => x.name === "work" || x.name.startsWith("work/"));
  if(!rootHasWork) {
    const candidates = new Set();
    for(const x of entries) {
      const marker = x.name.indexOf("/work/");
      if(marker >= 0) candidates.add(x.name.slice(0, marker + 1));
      else if(x.name.endsWith("/work")) candidates.add(x.name.slice(0, -"work".length));
    }
    if(candidates.size === 1) prefix = [...candidates][0];
  }

  const workRoot = prefix + "work";
  const browserRoot = prefix + "browser";
  const hasWork = entries.some(x => x.name === workRoot || x.name.startsWith(workRoot + "/"));

  const files = {};
  const dirs = ["/work"];

  for(const {rawName, name, entry} of entries) {
    let rel;

    if(hasWork) {
      if(name === workRoot) continue;
      if(!name.startsWith(workRoot + "/")) continue;
      rel = name.slice((workRoot + "/").length);
    } else {
      // Legacy/raw archive: everything except browser/ becomes /work.
      if(name === browserRoot || name.startsWith(browserRoot + "/")) continue;
      rel = name;
    }

    rel = rel.replace(/^\/+|\/+$/g, "");
    if(!rel) continue;

    const virtualPath = "/work/" + rel;

    if(entry.dir || rawName.endsWith("/")) {
      dirs.push(virtualPath);
    } else {
      const bytes = await entry.async("uint8array");
      files[virtualPath] = bytesToBase64(bytes);

      let parent = virtualPath.slice(0, virtualPath.lastIndexOf("/"));
      while(parent && parent.startsWith("/work")) {
        dirs.push(parent);
        if(parent === "/work") break;
        parent = parent.slice(0, parent.lastIndexOf("/"));
      }
    }
  }

  const snapshot = {
    version: 2,
    encoding: "base64",
    dirs: [...new Set(dirs)].sort((a,b) => a.length - b.length),
    files
  };

  const browserStorageEntry = entries.find(x => x.name === browserRoot + "/localStorage.json");
  if(browserStorageEntry) {
    const browserStorage = JSON.parse(await browserStorageEntry.entry.async("string"));
    if(browserStorage && typeof browserStorage === "object") {
      const remove = [];
      for(let i=0; i<localStorage.length; i++) {
        const k = localStorage.key(i);
        if(k && k.startsWith("iter-browser-") && k !== FSKEY)
          remove.push(k);
      }
      for(const k of remove) localStorage.removeItem(k);

      for(const [k, value] of Object.entries(browserStorage)) {
        if(k.startsWith("iter-browser-") && k !== FSKEY && k !== "iter-browser-verbatim-import")
          localStorage.setItem(k, String(value));
      }
    }
  }

  localStorage.setItem(FSKEY, JSON.stringify(snapshot));
  localStorage.setItem("iter-browser-verbatim-import", "1");

  stopRequested = true;
  location.reload();
}

function snapshotWork() {
  const files = {};
  const dirs = ["/work"];

  function walk(d) {
    for(const n of mp.FS.readdir(d)) {
      if(n === "." || n === "..") continue;
      const p = (d === "/" ? "" : d) + "/" + n;
      const st = mp.FS.stat(p);
      if(mp.FS.isDir(st.mode)) {
        if(p.startsWith("/work")) dirs.push(p);
        walk(p);
      } else if(p.startsWith("/work/")) {
        files[p] = bytesToBase64(new Uint8Array(mp.FS.readFile(p)));
      }
    }
  }

  walk("/work");
  return { version: 2, encoding: "base64", dirs, files };
}

function persist() {
  if(!mp) return;
  try {
    localStorage.setItem(FSKEY, JSON.stringify(snapshotWork()));
    scheduleFileRefresh();
  } catch(e) {
    console.warn("filesystem persist failed", e);
  }
}

function restore() {
  try {
    const raw = localStorage.getItem(FSKEY);
    if(!raw) return;

    const saved = JSON.parse(raw);

    // Current binary-safe format.
    if(saved && saved.version === 2 && saved.files) {
      for(const d of (saved.dirs || []).sort((a,b) => a.length - b.length))
        mkdirp(d);

      for(const [p, b64] of Object.entries(saved.files)) {
        mkdirp(p.slice(0, p.lastIndexOf("/")));
        mp.FS.writeFile(p, base64ToBytes(b64));
      }
      return;
    }

    // Backward compatibility with earlier text-only snapshots:
    // {"/work/file.txt": "contents", ...}
    if(saved && typeof saved === "object") {
      for(const [p, text] of Object.entries(saved)) {
        if(!p.startsWith("/work/")) continue;
        mkdirp(p.slice(0, p.lastIndexOf("/")));
        mp.FS.writeFile(p, enc.encode(String(text)));
      }
    }
  } catch(e) {
    console.warn("filesystem restore failed", e);
  }
}

function seed(p,s) { if(!exists(p)) write(p,s); }
// Shared filesystem adapter: just-bash operates directly on MicroPython's MEMFS.
class MicroPythonFs {
  resolvePath(base, target) {
    target = String(target || "");
    return target.startsWith("/") ? norm(target) : norm(String(base || "/") + "/" + target);
  }

  getAllPaths() {
    const paths = ["/"];
    const walk = dir => {
      let names;
      try { names = mp.FS.readdir(dir); } catch { return; }
      for (const name of names) {
        if (name === "." || name === "..") continue;
        const p = (dir === "/" ? "" : dir) + "/" + name;
        paths.push(p);
        try {
          const st = mp.FS.lstat ? mp.FS.lstat(p) : mp.FS.stat(p);
          if (mp.FS.isDir(st.mode)) walk(p);
        } catch {}
      }
    };
    walk("/");
    return paths;
  }

  async exists(p) {
    try {
      if (mp.FS.lstat) mp.FS.lstat(norm(p)); else mp.FS.stat(norm(p));
      return true;
    } catch { return false; }
  }

  _stat(p, follow=true) {
    p = norm(p);

    let st;
    try {
      st = (!follow && mp.FS.lstat) ? mp.FS.lstat(p) : mp.FS.stat(p);
    } catch (e) {
      const message = String(e?.message ?? e);
      const errno = Number(e?.errno);
      let missing = errno === 44 || message.includes("ENOENT") || message.toLowerCase().includes("no such file");

      // Emscripten FS often throws an opaque ErrnoError across the WASM proxy.
      // Ask the filesystem directly whether the path exists so just-bash gets
      // the ENOENT semantics required by its identity checks.
      if(!missing && mp.FS.analyzePath) {
        try { missing = !mp.FS.analyzePath(p).exists; } catch {}
      }

      if(missing)
        throw new Error("ENOENT: no such file or directory, stat '" + p + "'");
      throw e;
    }

    const isDirectory = mp.FS.isDir(st.mode);
    const isFile = mp.FS.isFile ? mp.FS.isFile(st.mode) : !isDirectory;
    const isSymbolicLink = mp.FS.isLink ? mp.FS.isLink(st.mode) : false;
    let mtime = st.mtime;
    if (!(mtime instanceof Date)) {
      const n = Number(mtime || Date.now());
      mtime = new Date(n < 1e12 ? n * 1000 : n);
    }

    const result = {
      isFile, isDirectory, isSymbolicLink,
      mode: Number(st.mode || (isDirectory ? 0o755 : 0o644)),
      size: Number(st.size || 0),
      mtime
    };

    // just-bash prefers an alias-resistant identity. Emscripten's node id is
    // stable for the life of the mounted filesystem and is better than
    // returning undefined/NaN dev+ino fields.
    try {
      const lookup = mp.FS.lookupPath(p, { follow });
      if(lookup?.node?.id !== undefined)
        result.identity = "emscripten:" + String(lookup.node.id);
    } catch {}

    if(result.identity === undefined) {
      const dev = Number(st.dev);
      const ino = Number(st.ino);
      if(Number.isFinite(dev) && Number.isFinite(ino)) {
        result.dev = dev;
        result.ino = ino;
      }
    }

    return result;
  }

  async stat(p) { return this._stat(p, true); }
  async lstat(p) { return this._stat(p, false); }

  async realpath(p) {
    p = norm(p);
    mp.FS.stat(p);
    try {
      const r = mp.FS.lookupPath(p, { follow:true });
      return r?.path ? norm(r.path) : p;
    } catch { return p; }
  }

  async readFileBuffer(p) {
    const st = this._stat(p);
    if (st.isDirectory) throw new Error("EISDIR: " + p);
    return new Uint8Array(mp.FS.readFile(norm(p)));
  }

  async readFile(p) { return dec.decode(await this.readFileBuffer(p)); }

  async readdir(p) {
    const st = this._stat(p);
    if (!st.isDirectory) throw new Error("ENOTDIR: " + p);
    return mp.FS.readdir(norm(p)).filter(x => x !== "." && x !== "..");
  }

  async readdirWithFileTypes(p) {
    const base = norm(p);
    return (await this.readdir(base)).map(name => {
      const q = (base === "/" ? "" : base) + "/" + name;
      const st = this._stat(q, false);
      return { name, isFile:st.isFile, isDirectory:st.isDirectory, isSymbolicLink:st.isSymbolicLink };
    });
  }

  async writeFile(p, content) {
    p = norm(p);
    const bytes = typeof content === "string" ? enc.encode(content) : new Uint8Array(content);
    mp.FS.writeFile(p, bytes);
    persist();
  }

  async appendFile(p, content) {
    p = norm(p);
    const add = typeof content === "string" ? enc.encode(content) : new Uint8Array(content);
    let old = new Uint8Array(0);
    try { old = new Uint8Array(mp.FS.readFile(p)); } catch {}
    const all = new Uint8Array(old.length + add.length);
    all.set(old); all.set(add, old.length);
    mp.FS.writeFile(p, all);
    persist();
  }

  async mkdir(p, options={}) {
    p = norm(p);
    if (options?.recursive) mkdirp(p); else mp.FS.mkdir(p);
    persist();
  }

  _rmTree(p) {
    p = norm(p);
    const st = mp.FS.lstat ? mp.FS.lstat(p) : mp.FS.stat(p);
    if (mp.FS.isDir(st.mode)) {
      for (const n of mp.FS.readdir(p)) {
        if (n === "." || n === "..") continue;
        this._rmTree((p === "/" ? "" : p) + "/" + n);
      }
      mp.FS.rmdir(p);
    } else mp.FS.unlink(p);
  }

  async rm(p, options={}) {
    p = norm(p);
    try {
      const st = mp.FS.lstat ? mp.FS.lstat(p) : mp.FS.stat(p);
      if (mp.FS.isDir(st.mode)) {
        if (!options?.recursive) throw new Error("EISDIR: " + p);
        this._rmTree(p);
      } else mp.FS.unlink(p);
      persist();
    } catch (e) {
      if (!options?.force) throw e;
    }
  }

  async cp(src, dest, options={}) {
    src = norm(src); dest = norm(dest);
    const st = this._stat(src, false);
    if (st.isDirectory) {
      if (!options?.recursive) throw new Error("EISDIR: " + src);
      mkdirp(dest);
      for (const n of await this.readdir(src)) {
        await this.cp(
          (src === "/" ? "" : src) + "/" + n,
          (dest === "/" ? "" : dest) + "/" + n,
          {recursive:true}
        );
      }
    } else mp.FS.writeFile(dest, mp.FS.readFile(src));
    persist();
  }

  async mv(src, dest) {
    mp.FS.rename(norm(src), norm(dest));
    persist();
  }

  async chmod(p, mode) {
    if (mp.FS.chmod) mp.FS.chmod(norm(p), Number(mode));
  }

  async symlink(target, linkPath) {
    if (!mp.FS.symlink) throw new Error("ENOSYS: symlink");
    mp.FS.symlink(String(target), norm(linkPath));
    persist();
  }

  async link(existingPath, newPath) {
    const st = this._stat(existingPath);
    if (!st.isFile) throw new Error("ENOSYS: hard-link non-file");
    mp.FS.writeFile(norm(newPath), mp.FS.readFile(norm(existingPath)));
    persist();
  }

  async readlink(p) {
    if (!mp.FS.readlink) throw new Error("ENOSYS: readlink");
    return String(mp.FS.readlink(norm(p)));
  }

  async utimes(p, atime, mtime) {
    if (mp.FS.utime) mp.FS.utime(norm(p), atime, mtime);
  }
}

function pythonPayload(args, ctx) {
  const argv = Array.from(args, String);
  if (!argv.length) return {error:'python3: use "python3 FILE" or "python3 -c CODE"'};
  if (argv[0] === "-c") {
    return {
      code:argv.slice(1).join(" "),
      filename:"<string>",
      argv:["-c", ...argv.slice(2)],
      cwd:String(ctx.cwd || "/work")
    };
  }
  return {
    code:null,
    filename:bashFs.resolvePath(String(ctx.cwd || "/work"), argv[0]),
    argv,
    cwd:String(ctx.cwd || "/work")
  };
}

async function runPythonPayload(payload, ctx, fromPython=false) {
  if (payload.error) return {stdout:"", stderr:payload.error+"\n", exitCode:2};

  let code = payload.code;
  if (code == null) {
    try { code = await ctx.fs.readFile(payload.filename); }
    catch (e) { return {stdout:"", stderr:"python3: "+String(e?.message ?? e)+"\n", exitCode:1}; }
  }

  // If MicroPython called Bash, avoid recursively entering the same WASM VM.
  if (fromPython) {
    return {
      stdout:"__ITER_PYTHON__\n"+JSON.stringify({
        code, filename:payload.filename, argv:payload.argv, cwd:payload.cwd
      }),
      stderr:"",
      exitCode:0
    };
  }

  pyCapture = {stdout:[], stderr:[]};
  try {
    const wrapper =
      "import os, sys\n" +
      "_jb_cwd=os.getcwd()\n" +
      "_jb_had_argv=hasattr(sys,'argv')\n" +
      "_jb_argv=getattr(sys,'argv',None)\n" +
      "try:\n" +
      " os.chdir(" + JSON.stringify(payload.cwd) + ")\n" +
      " try:\n  sys.argv=" + JSON.stringify(payload.argv) + "\n except Exception:\n  pass\n" +
      " exec(" + JSON.stringify(code) + ", {'__name__':'__main__','__file__':" + JSON.stringify(payload.filename) + "})\n" +
      "finally:\n" +
      " os.chdir(_jb_cwd)\n" +
      " if _jb_had_argv:\n  try:\n   sys.argv=_jb_argv\n  except Exception:\n   pass\n" +
      " else:\n  try:\n   delattr(sys,'argv')\n  except Exception:\n   pass\n";
    await mp.runPythonAsync(wrapper);
    return {stdout:pyCapture.stdout.join(""), stderr:pyCapture.stderr.join(""), exitCode:0};
  } catch (e) {
    return {
      stdout:pyCapture.stdout.join(""),
      stderr:pyCapture.stderr.join("")+String(e?.message ?? e)+"\n",
      exitCode:1
    };
  } finally {
    pyCapture = null;
    persist();
  }
}

function makePythonCommand(name, fromPython) {
  return defineCommand(name, async (args, ctx) => {
    // Iter already owns the single MicroPython VM while it is running.
    // A user-side live shell must not recursively call runPythonAsync().
    if (!fromPython && iterRunning) {
      return {
        stdout:"",
        stderr:name+": unavailable from live shell while Iter is running (the MicroPython VM is busy)\n",
        exitCode:1
      };
    }
    return runPythonPayload(pythonPayload(args, ctx), ctx, fromPython);
  });
}

function newBash(fromPython=false) {
  return new Bash({
    fs:bashFs,
    cwd:"/work",
    env:{
      USER:"iter", LOGNAME:"iter", HOME:"/work", SHELL:"/bin/bash",
      HOSTNAME:"browser", TERM:"xterm", PATH:"/bin:/usr/bin:/work"
    },
    network:{dangerouslyAllowFullInternetAccess:true},
    customCommands:[
      makePythonCommand("python3", fromPython),
      makePythonCommand("python", fromPython)
    ]
  });
}

async function runBash(command, fromPython=false) {
  if(fromPython) {
    const result = await newBash(true).exec(String(command), {cwd:"/work/iter", rawScript:true});
    persist();
    return String(result.stdout || "") + String(result.stderr || "");
  }

  try {
    const st = mp.FS.stat(terminalCwd);
    if(!mp.FS.isDir(st.mode)) terminalCwd = "/work";
  } catch {
    terminalCwd = "/work";
  }

  const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
  const cwdFile = "/tmp/.iter-cwd-" + id;
  const script =
    String(command) +
    "\n__iter_status=$?\npwd > " + JSON.stringify(cwdFile) +
    "\nexit $__iter_status";

  const result = await newBash(false).exec(script, {cwd:terminalCwd, rawScript:true});

  try {
    const cwd = dec.decode(mp.FS.readFile(cwdFile)).trim();
    if(cwd.startsWith("/work")) terminalCwd = cwd;
  } catch {}
  try { mp.FS.unlink(cwdFile); } catch {}

  saveUiState();
  persist();
  return String(result.stdout || "") + String(result.stderr || "");
}


async function captureSelfScreenshot() {
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

  const canvas = await html2canvas(document.body, {
    backgroundColor: "#111",
    useCORS: true,
    logging: false,
    width: window.innerWidth,
    height: window.innerHeight,
    scrollX: window.scrollX,
    scrollY: window.scrollY,
    windowWidth: window.innerWidth,
    windowHeight: window.innerHeight
  });

  const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/[^A-Za-z0-9_-]/g, "_");
  const dir = "/work/iter/_screenshots";
  mkdirp(dir);

  const record = {
    id,
    path: dir + "/" + id + ".json",
    mime: "image/jpeg",
    width: canvas.width,
    height: canvas.height,
    captured_at: new Date().toISOString(),
    data_url: dataUrl
  };

  mp.FS.writeFile(record.path, enc.encode(JSON.stringify(record)));
  persist();

  return JSON.stringify({
    id: record.id,
    path: record.path,
    mime: record.mime,
    width: record.width,
    height: record.height,
    captured_at: record.captured_at
  });
}

async function startIter() {
  if(iterRunning) return;
  stopRequested=false; iterRunning=true;
  start.disabled=true; stop.disabled=false;
  setStatus('running', true);
  out('\n[Iter started]\n');
  try {
    mp.FS.chdir('/work/iter');
    await mp.runPythonAsync(read('/work/iter/iter.py'));
  }
  catch(e) { out('\n[Iter crashed] '+(e?.stack||e)+'\n'); }
  finally {
    try { mp.FS.chdir('/work'); } catch {}
    iterRunning=false;
    stop.disabled=true;
    start.disabled=false;
    setStatus('stopped', false);
    persist();
  }
}


// --------------------------------------------------------------------
// Hidden PeTTa runtime for tools/metta.py.
// Mirrors the supplied PeTTaWeb flow: SWIPL -> silent/working_dir ->
// consult petta.pl -> metta(JSON-stringified-code). No PeTTa UI is added.
// --------------------------------------------------------------------
const PETTA_SWIPL_URL = "http://91.203.212.130/pettaweb/swipl-bundle.js";
const PETTA_PL_URL = "http://91.203.212.130/pettaweb/petta.pl";
let pettaRuntimePromise = null;
let pettaProlog = null;
let pettaOutputCapture = null;
let pettaExecutionQueue = Promise.resolve();

function loadPettaScript(src) {
  if(typeof globalThis.SWIPL === "function")
    return Promise.resolve();

  return new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-iter-petta-swipl="1"]');
    if(existing) {
      existing.addEventListener("load", () => resolve(), {once:true});
      existing.addEventListener("error", () => reject(new Error("failed to load PeTTa SWI-Prolog bundle")), {once:true});
      return;
    }

    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.dataset.iterPettaSwipl = "1";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("failed to load " + src));
    document.head.appendChild(script);
  });
}

async function ensurePettaRuntime() {
  if(pettaRuntimePromise) return pettaRuntimePromise;

  pettaRuntimePromise = (async () => {
    await loadPettaScript(PETTA_SWIPL_URL);

    if(typeof globalThis.SWIPL !== "function")
      throw new Error("SWIPL was not defined by " + PETTA_SWIPL_URL);

    const module = await globalThis.SWIPL({
      on_output: line => {
        if(pettaOutputCapture)
          pettaOutputCapture.push(String(line));
      }
    });

    pettaProlog = module.prolog;
    if(!pettaProlog)
      throw new Error("SWI-Prolog WASM initialized without module.prolog");

    // Same initialization used by the supplied PeTTaWeb.
    pettaProlog.query("asserta(silent(true)).").once();
    pettaProlog.query('asserta(working_dir("")).').once();

    // In PeTTaWeb this is consult("petta.pl").  This Iter HTML normally runs
    // from file://, so use the same PeTTaWeb resource as an absolute URL.
    await pettaProlog.consult(PETTA_PL_URL);

    // Same readiness probe used by the supplied PeTTaWeb.
    pettaProlog.query('metta("!(42)").').once();

    return pettaProlog;
  })();

  try {
    return await pettaRuntimePromise;
  } catch(e) {
    pettaRuntimePromise = null;
    pettaProlog = null;
    throw e;
  }
}

async function runPettaMetta(code) {
  const execute = async () => {
    const prolog = await ensurePettaRuntime();
    const captured = [];
    pettaOutputCapture = captured;

    try {
      // Same execution call as the supplied PeTTaWeb:
      // Prolog.query("metta(" + JSON.stringify(code) + ").").once()
      prolog.query("metta(" + JSON.stringify(String(code)) + ").").once();
    } finally {
      pettaOutputCapture = null;
    }

    const cleanLines = [];
    for(const chunk of captured) {
      for(const rawLine of String(chunk).split(/\r?\n/)) {
        const line = rawLine.replace(/\x1b\[[0-9;]*m/g, "").trim();
        if(line) cleanLines.push(line);
      }
    }

    const results = [];
    for(const line of cleanLines) {
      const match = line.match(/^Result:\s*(.*)$/);
      if(match) results.push(match[1]);
    }

    if(results.length)
      return results.join("\n");

    const fallback = cleanLines.join("\n").trim();
    return fallback || "done";
  };

  // Iter invokes tools serially today, but keep the shared Prolog engine safe
  // if browser-side calls ever overlap.
  pettaExecutionQueue = pettaExecutionQueue.then(execute, execute);
  return pettaExecutionQueue;
}

mp.registerJsModule('bridge', {
  config:()=>JSON.stringify({
    base_url:String(endpoint.value || '').trim().replace(/\/+$/, ''),
    model:model.value,
    api_key:key.value
  }),
  session_id:()=>crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
  receive:()=>inbox.shift() ?? '',
  send:message=>{ addChat('iter', String(message), 'terminal'); return 'sent'; },
  chat_in:(channel,message)=>{ addChat('user', String(message), String(channel||'channel')); return true; },
  chat_out:(channel,message)=>{ addChat('iter', String(message), String(channel||'channel')); return true; },
  screenshot:async ()=>{
    try {
      return await captureSelfScreenshot();
    } catch(e) {
      return '__ITER_SCREENSHOT_ERROR__\n' + String(e?.message ?? e);
    }
  },
  shell:async command=>{
    try {
      return await runBash(String(command), true);
    } catch(e) {
      return '__ITER_SHELL_ERROR__\n' + String(e?.message ?? e);
    }
  },
  metta:async code=>{
    try {
      return await runPettaMetta(String(code));
    } catch(e) {
      return '__ITER_METTA_ERROR__\n' + String(e?.message ?? e);
    }
  },
  persist:()=>{persist(); return true;},
  sleep:ms=>new Promise(resolve=>setTimeout(resolve,Number(ms)||0)),
  should_stop:()=>stopRequested,
  llm:async(url,_apiKey,payload,session)=>{
    // Normalize accidental duplicate slashes after the URL scheme. This avoids
    // redirects such as /api/v1//chat/completions, where auth can be lost.
    let target = String(url).trim();
    target = target.replace(/([^:]\/)\/{2,}/g, '$1');

    const uiKey = String(key.value || '').trim();
    const passedKey = String(_apiKey || '').trim();
    const apiKey =
      (uiKey && uiKey !== 'dummy') ? uiKey :
      (passedKey && passedKey !== 'dummy') ? passedKey : '';

    const isOpenRouter = target.includes('openrouter.ai');
    if(isOpenRouter && !apiKey)
      throw new Error('OpenRouter API key missing: paste a real sk-or-v1-... key in the password field');

    // Use a plain object so the exact headers supplied to fetch are unambiguous.
    const headers = {
      'Content-Type': 'application/json'
    };
    if(apiKey)
      headers['Authorization'] = 'Bearer ' + apiKey;

    // Local Iter/vMLX metadata only. Never send these to OpenRouter.
    if(!isOpenRouter) {
      headers['X-APC-Tenant'] = 'iter';
      headers['x-session-id'] = String(session);
    }

    const r = await fetch(target, {
      method: 'POST',
      mode: 'cors',
      headers,
      body: String(payload)
    });

    const text = await r.text();
    if(!r.ok) {
      // Never print the secret itself. These diagnostics make auth/redirect
      // regressions obvious instead of producing an unexplained 401.
      const authSet = Object.prototype.hasOwnProperty.call(headers, 'Authorization');
      const finalUrl = String(r.url || target);
      throw new Error(
        'HTTP '+r.status+': '+text.slice(0,1000) +
        ' [auth_header_set='+authSet+
        ', key_length='+apiKey.length+
        ', requested='+target+
        ', final='+finalUrl+
        ', redirected='+String(!!r.redirected)+']'
      );
    }
    return text;
  }
});

   if 'default' in schema:\n        bits.append('default: ' + repr(schema['default']))\n    if 'minimum' in schema:\n        bits.append('min: ' + str(schema['minimum']))\n    if 'maximum' in schema:\n        bits.append('max: ' + str(schema['maximum']))\n    if 'minLength' in schema:\n        bits.append('minLength: ' + str(schema['minLength']))\n    if 'maxLength' in schema:\n        bits.append('maxLength: ' + str(schema['maxLength']))\n\n    return ' · '.join(bits)\n\n\ndef _parameter_rows(parameters):\n    if not isinstance(parameters, dict):\n        return '', 0, 0\n\n    properties = parameters.get('properties', {})\n    if not isinstance(properties, dict):\n        properties = {}\n\n    required = parameters.get('required', [])\n    required = set(required if isinstance(required, list) else [])\n\n    rows = []\n    for name, schema in properties.items():\n        schema = schema if isinstance(schema, dict) else {}\n        req = name in required\n        description = str(schema.get('description', '') or '')\n        constraints = _schema_constraints(schema)\n\n        rows.append('\u003cdiv class=\"schema-param\"\u003e')\n        rows.append('\u003ccode class=\"schema-param-name\"\u003e' + _escape_html(str(name)) + '\u003c/code\u003e')\n        rows.append('\u003ccode class=\"schema-param-type\"\u003e' + _escape_html(_schema_type(schema)) + '\u003c/code\u003e')\n        rows.append('\u003cspan class=\"schema-param-mode ' + ('is-required' if req else '') + '\"\u003e' + ('required' if req else 'optional') + '\u003c/span\u003e')\n        if description or constraints:\n            detail = description\n            if description and constraints:\n                detail += ' · '\n            detail += constraints\n            rows.append('\u003cspan class=\"schema-param-detail\"\u003e' + _escape_html(detail) + '\u003c/span\u003e')\n        rows.append('\u003c/div\u003e')\n\n    return ''.join(rows), len(properties), len(required)\n\n\ndef _tool_signature(name, parameters):\n    properties = parameters.get('properties', {}) if isinstance(parameters, dict) else {}\n    if not isinstance(properties, dict):\n        properties = {}\n    required = parameters.get('required', []) if isinstance(parameters, dict) else []\n    required = set(required if isinstance(required, list) else [])\n\n    pieces = ['\u003cspan class=\"sig-name\"\u003e' + _escape_html(name) + '\u003c/span\u003e\u003cspan class=\"sig-punct\"\u003e(\u003c/span\u003e']\n    for i, param_name in enumerate(properties.keys()):\n        if i:\n            pieces.append('\u003cspan class=\"sig-punct\"\u003e, \u003c/span\u003e')\n        pieces.append('\u003cspan class=\"sig-param\"\u003e' + _escape_html(str(param_name)) + '\u003c/span\u003e')\n        if param_name not in required:\n            pieces.append('\u003cspan class=\"sig-optional\"\u003e?\u003c/span\u003e')\n    pieces.append('\u003cspan class=\"sig-punct\"\u003e)\u003c/span\u003e')\n    return ''.join(pieces)\n\n\ndef _tools_to_html(tools):\n    if not tools:\n        return '\u003cdiv class=\"empty-state\"\u003eNo tools.\u003c/div\u003e'\n\n    normalized = [_normalize_tool(t) for t in tools]\n    normalized.sort(key=lambda t: t['name'].lower())\n\n    total_chars = sum(len(json.dumps(t['raw'])) for t in normalized)\n    parts = [\n        '\u003cdiv class=\"tools-summary\"\u003e'\n        '\u003cspan\u003e\u003cstrong\u003e' + _fmt_int(len(normalized)) + '\u003c/strong\u003e available tools\u003c/span\u003e'\n        '\u003cspan\u003e\u003cstrong\u003e' + _fmt_int(total_chars) + '\u003c/strong\u003e schema chars\u003c/span\u003e'\n        '\u003c/div\u003e',\n        '\u003cdiv class=\"tools-list\"\u003e'\n    ]\n\n    for tool in normalized:\n        name = tool['name']\n        description = tool['description']\n        parameters = tool['parameters']\n        raw_chars = len(json.dumps(tool['raw']))\n        param_html, param_count, required_count = _parameter_rows(parameters)\n\n        parts.ap -----------------------------------------------------\n# Message and tool-call rendering\n# -----------------------------------------------------------------------------\n\ndef _render_call_value(value):\n    if isinstance(value, (dict, list)):\n        text = _json_pretty(value)\n    else:\n        text = str(value)\n    return _escape_html(text)\n\n\ndef _split_step_prefix(text):\n    \"\"\"Split Iter's 'Step YYYY-MM-DD HH:MM:SS: ...' wrapper from actual content.\"\"\"\n    text = str(text)\n    match = re.match(r'^Step (\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}):\\s?(.*)$', text, 0)\n    if match:\n        return match.group(1), match.group(2)\n    return '', text\n\n\ndef _pretty_return_content(content):\n    timestamp, body = _split_step_prefix(content)\n    stripped = body.strip()\n    if stripped:\n        try:\n            parsed = json.loads(stripped)\n        except Exception:\n            pretty = body\n        else:\n            pretty = _json_pretty(parsed)\n    else:\n        pretty = body\n    return timestamp, pretty\n\n\ndef _tool_return_to_html(message):\n    content = _msg_content_str(message)\n    timestamp, pretty = _pretty_return_content(content)\n    char_count = _msg_len(message)\n\n    parts = ['\u003cdiv class=\"tool-return\"\u003e']\n    parts.append('\u003cdiv class=\"tool-return-head\"\u003e')\n    parts.append('\u003cspan class=\"tool-return-label\"\u003eRETURN\u003c/span\u003e')\n    if timestamp:\n        parts.append('\u003cspan class=\"tool-return-time\"\u003e' + _escape_html(timestamp) + '\u003c/span\u003e')\n    parts.append('\u003cspan class=\"tool-return-chars\"\u003e' + _fmt_int(char_count) + ' chars\u003c/span\u003e')\n    parts.append('\u003c/div\u003e')\n    parts.append('\u003cpre class=\"tool-return-value\"\u003e' + _escape_html(pretty) + '\u003c/pre\u003e')\n    parts.append('\u003c/div\u003e')\n    return ''.join(parts)\n\n\ndef _tool_result_index(messages):\n    \"\"\"Map tool_call_id -\u003e queued (message index, message) return values.\"\"\"\n    lookup = {}\n    for index, message in enumerate(messages):\n        if str(message.get('role', '')).lower() != 'tool':\n            continue\n        call_id = str(message.get('tool_call_id', '') or '')\n        if not call_id:\n            continue\n        lookup.setdefault(call_id, []).append((index, message))\n    return lookup\n\n\ndef _tool_calls_to_html(m, tool_results=None, consumed=None):\n    \"\"\"Render assistant tool calls with their synchronous Iter return directly beneath.\"\"\"\n    tool_calls = m.get('tool_calls', [])\n    if not tool_calls:\n        return ''\n\n    tool_results = tool_results or {}\n    consumed = consumed if consumed is not None else set()\n    html_parts = ['\u003cdiv class=\"tool-calls\"\u003e']\n\n    for tc in tool_calls:\n        if not isinstance(tc, dict):\n            continue\n\n        fn = tc.get('function', {}) if isinstance(tc.get('function'), dict) else {}\n        tc_name = str(fn.get('name', '?'))\n        tc_args_raw = fn.get('arguments', '{}')\n        tc_id = str(tc.get('id', '') or '')\n\n        parsed_ok = True\n        try:\n            tc_args = json.loads(tc_args_raw) if isinstance(tc_args_raw, str) else tc_args_raw\n        except Exception:\n            parsed_ok = False\n            tc_args = tc_args_raw\n\n        html_parts.append('\u003cdiv class=\"tool-exchange\"\u003e')\n        html_parts.append('\u003cdiv class=\"tool-call\"\u003e')\n        html_parts.append('\u003cdiv class=\"tool-call-head\"\u003e')\n        html_parts.append('\u003cspan class=\"tool-call-label\"\u003eCALL\u003c/span\u003e')\n        html_parts.append('\u003ccode class=\"tool-call-name\"\u003e' + _escape_html(tc_name) + '\u003c/code\u003e')\n        if tc_id:\n            html_parts.append('\u003ccode class=\"tool-call-id\"\u003e' + _escape_html(tc_id) + '\u003c/code\u003e')\n        html_parts.append('\u003c/div\u003e')\n\n        if parsed_ok and isinstance(tc_args, dict):\n            if tc_args:\n                html_parts.append('\u003cdiv class=\"call-args\"\u003e')\n                for key, value in tc_args.items():\n                    html_parts.append('\u003cdiv class=\"call-arg\"\u003e')\n                    html_parts.append('\u003ccode class=\"call-arg-key\"\u003e' + _escape_html(str(key)) + '\u003c/code\u003e')\n                    html_parts.append('\u003cpre class=\"call-arg-value\"\u003e' + _render_call_value(value) + '\u003c/pre\u003e')\n                    html_parts.append('\u003c/div\u003e')\n                html_parts.append('\u003c/div\u003e')\n            else:\n                html_parts.append('\u003cdiv class=\"empty-note call-empty\"\u003eNo arguments.\u003c/div\u003e')\n        else:\n            html_parts.append('\u003cpre class=\"tool-call-raw\"\u003e' + _escape_html(str(tc_args_raw)) + '\u003c/pre\u003e')\n\n        html_parts.append('\u003c/div\u003e')\n\n        matched = None\n        if tc_id:\n            queue = tool_results.get(tc_id, [])\n            while queue:\n                result_index, result_message = queue.pop(0)\n                if result_index not in consumed:\n                    consumed.add(result_index)\n                    matched = result_message\n                    break\n\n        if matched is not None:\n            html_parts.append(_tool_return_to_html(matched))\n        else:\n            html_parts.append('\u003cdiv class=\"tool-return pending-return\"\u003e\u003cspan class=\"tool-return-label\"\u003eRETURN\u003c/span\u003e\u003cspan\u003eNo matching return in current context.\u003c/span\u003e\u003c/div\u003e')\n\n        html_parts.append('\u003c/div\u003e')\n\n    html_parts.append('\u003c/div\u003e')\n    return ''.join(html_parts)\n\n\ndef _msg_to_html(messages):\n    if not messages:\n        return '\u003cdiv class=\"empty-state\"\u003eNo messages this cycle.\u003c/div\u003e'\n\n    html_parts = ['\u003cdiv class=\"messages-list\"\u003e']\n    role_labels = {\n        'user': 'USER',\n        'assistant': 'ASSISTANT',\n        'tool': 'TOOL RETURN',\n        'system': 'SYSTEM',\n        'developer': 'DEVELOPER',\n    }\n    tool_results = _tool_result_index(messages)\n    consumed_tool_messages = set()\n\n    for i, m in enumerate(messages):\n        role_raw = str(m.get('role', 'unknown')).lower()\n\n        # In Iter these are synchronous return values for prior tool_calls. If matched,\n        # they are rendered inside the originating call instead of duplicated here.\n        if role_raw == 'tool' and i in consumed_tool_messages:\n            continue\n\n        role = _escape_html(role_raw)\n        role_label = role_labels.get(role_raw, role_raw.upper())\n        content_raw = _msg_content_str(m)\n        char_count = _msg_len(m)\n        reasoning_fields = []\n        if role_raw != \"user\":\n            for key in ('reasoning', 'reasoning_content'):\n                value = m.get(key)\n                if value:\n                    reasoning_fields.append((key, value if isinstance(value, str) else _json_pretty(value)))\n                    break\n\n        html_parts.append('\u003carticle class=\"message role-' + role + '\"\u003e')\n        html_parts.append('\u003cdiv class=\"message-meta\"\u003e')\n        html_parts.append('\u003cspan class=\"message-index\"\u003e' + \"%02d\" % (i + 1) + '\u003c/span\u003e')\n        html_parts.append('\u003cspan class=\"message-role\"\u003e' + _escape_html(role_label) + '\u003c/span\u003e')\n        html_parts.append('\u003cspan class=\"message-chars\"\u003e' + _fmt_int(char_count) + ' chars\u003c/span\u003e')\n        if m.get('tool_call_id'):\n            html_parts.append('\u003ccode class=\"message-tool-link\"\u003e↳ ' + _escape_html(str(m.get('tool_call_id'))) + '\u003c/code\u003e')\n        html_parts.append('\u003c/div\u003e')\n\n        html_parts.append('\u003cdiv class=\"message-body\"\u003e')\n        if content_raw.strip():\n            timestamp, body = _split_step_prefix(content_raw)\n            if timestamp:\n                html_parts.append('\u003cdiv class=\"message-step\"\u003e' + _escape_html(timestamp) + '\u003c/div\u003e')\n            if body.strip():\n                html_parts.append('\u003cdiv class=\"message-content\"\u003e' + _escape_html(body) + '\u003c/div\u003e')\n        for key, value in reasoning_fields:\n            html_parts.append('\u003cdiv class=\"message-reasoning\"\u003e')\n            html_parts.append('\u003cdiv class=\"message-reasoning-label\"\u003e' + _escape_html(key.upper()) + '\u003c/div\u003e')\n            html_parts.append('\u003cpre class=\"message-reasoning-content\"\u003e' + _escape_html(value) + '\u003c/pre\u003e')\n            html_parts.append('\u003c/div\u003e')\n        tc_html = _tool_calls_to_html(m, tool_results, consumed_tool_messages)\n        if tc_html:\n            html_parts.append(tc_html)\n        html_parts.append('\u003c/div\u003e')\n        html_parts.append('\u003c/article\u003e')\n\n    html_parts.append('\u003c/div\u003e')\n    return ''.join(html_parts)\n\n\n# -----------------------------------------------------------------------------\n# Styling\n# -----------------------------------------------------------------------------\n\nCSS = r'''\n:root {\n    color-scheme: dark;\n    --bg: #0b0d10;\n    --panel: #111419;\n    --panel-2: #151920;\n    --panel-3: #191e26;\n    --line: #2a3039;\n    --line-strong: #38414d;\n    --text: #d8dee9;\n    --text-strong: #eef2f7;\n    --muted: #808a98;\n    --dim: #5f6977;\n    --blue: #6ea8fe;\n    --green: #7ccf91;\n    --orange: #e7a86e;\n    --violet: #b8a1e3;\n    --red: #e98686;\n    --cyan: #79c7d3;\n    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n    --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n}\n\n* { box-sizing: border-box; }\nhtml { background: var(--bg); }\nbody {\n    margin: 0;\n    background: var(--bg);\n    color: var(--text);\n                   frame.setAttribute(\"data-dashboard-source\", raw)\n    except Exception:\n        pass\n\ndef transform(messages, tools):\n    docs = {}\n    for view, filename, label in DASHBOARDS:\n        docs[view] = _read_dashboard(filename)\n\n    html_doc = _standalone_html(docs)\n    try:\n        with open(GALLERY_PATH, \"w\") as f:\n            f.write(html_doc)\n    except Exception:\n        pass\n\n    _ensure_live_drawer(docs)\n    return messages, tools\n");
seed("/work/iter/transformations/dashboard_runtime.py", "import time, json, os\n\nDESCRIPTION = \"Runtime dashboard without atom-space visualization or recent messages\"\n\nROOT = \"/work/iter\"\nTASKS_FILE = ROOT + \"/memory/tasks/current_tasks.txt\"\nALARMS_DIR = ROOT + \"/memory/alarms\"\n\ndef _escape_html(value):\n    return str(value).replace(\"\u0026\", \"\u0026amp;\").replace(\"\u003c\", \"\u0026lt;\").replace(\"\u003e\", \"\u0026gt;\").replace('\"', \"\u0026quot;\").replace(\"'\", \"\u0026#x27;\")\n\ndef _exists(path):\n    try:\n        os.stat(path)\n        return True\n    except OSError:\n        return False\n\ndef _isdir(path):\n    try:\n        return bool(os.stat(path)[0] \u0026 0x4000)\n    except OSError:\n        return False\n\ndef _walk_files(root):\n    result = []\n    stack = [root]\n    while stack:\n        folder = stack.pop()\n        try:\n            names = sorted(os.listdir(folder))\n        except OSError:\n            continue\n        subdirs = []\n        for name in names:\n            full = folder.rstrip(\"/\") + \"/\" + name\n            if _isdir(full):\n                subdirs.append(full)\n            else:\n                result.append(full)\n        for full in reversed(subdirs):\n            stack.append(full)\n    return sorted(result)\n\ndef _fmt_time(value=None):\n    t = time.localtime() if value is None else time.localtime(value)\n    return \"%04d-%02d-%02d %02d:%02d:%02d\" % (t[0], t[1], t[2], t[3], t[4], t[5])\n\ndef _fmt_int(value):\n    try:\n        s = str(int(value))\n        sign = \"\"\n        if s.startswith(\"-\"):\n            sign, s = \"-\", s[1:]\n        parts = []\n        while len(s) \u003e 3:\n            parts.insert(0, s[-3:])\n            s = s[:-3]\n        parts.insert(0, s)\n        return sign + \",\".join(parts)\n    except Exception:\n        return str(value)\n\ndef get_system_info():\n    tools_dir = ROOT + \"/tools\"\n    tool_files = []\n    if _isdir(tools_dir):\n        for name in sorted(os.listdir(tools_dir)):\n            if name.startswith(\"__\"):\n                continue\n            if name.endswith(\".py\") or name.endswith(\".js\"):\n                tool_files.append(name.rsplit(\".\", 1)[0])\n    seen = set()\n    tools = []\n    for name in tool_files:\n        if name not in seen:\n            seen.add(name)\n            tools.append(name)\n\n    channels = []\n    chan_dir = ROOT + \"/channels\"\n    if _isdir(chan_dir):\n        for name in sorted(os.listdir(chan_dir)):\n            if name.endswith(\".py\") and not name.startswith(\"_\"):\n                channels.append(name[:-3])\n\n    transforms = []\n    trans_dir = ROOT + \"/transformations\"\n    if _isdir(trans_dir):\n        for name in sorted(os.listdir(trans_dir)):\n            if name.endswith(\".py\"):\n                transforms.append(name[:-3])\n\n    mem_files = []\n    total_size = 0\n    mem_dir = ROOT + \"/memory\"\n    if _isdir(mem_dir):\n        for full in _walk_files(mem_dir):\n            name = full.rsplit(\"/\", 1)[-1]\n            if name.startswith(\"_\"):\n                continue\n            try:\n                size = os.stat(full)[6]\n            except OSError:\n                continue\n            total_size += size\n            rel = full[len(ROOT) + 1:] if full.startswith(ROOT + \"/\") else full\n            mem_files.append((rel, size))\n    return tools, channels, transforms, mem_files, total_size\n\ndef upload_html(html_doc):\n    try:\n        with open(ROOT + \"/dashboard_runtime.html\", \"w\") as f:\n            f.write(html_doc)\n    except Exception:\n        pass\n\ndef get_tool_reliability():\n    tr_file = ROOT + \"/transformations/.runtime/tool_reliability.json\"\n    tools_dir = ROOT + \"/tools\"\n    if not _exists(tr_file):\n        return []\n    try:\n        existing_tools = set()\n        if _isdir(tools_dir):\n            for name in os.listdir(tools_dir):\n                if name.endswith(\".py\") and not name.startswith(\"_\"):\n                    existing_tools.add(name[:-3])\n        with open(tr_file) as f:\n            data = json.loads(f.read())\n        rows = []\n        for name, info in sorted(data.items(), key=lambda x: -x[1].get(\"calls\", 0)):\n            if name not in existing_tools:\n                continue\n            rows.append({\n                \"name\": name,\n                \"f\": info.get(\"f\", 0),\n                \"c\": info.get(\"c\", 0),\n                \"calls\": info.get(\"calls\", 0),\n                \"successes\": info.get(\"successes\", 0),\n                \"failures\": info.get(\"failures\", 0)\n            })\n        return rows\n    except Exception:\n        return []\n\ndef get_alarms():\n    alarms = []\n    if not _isdir(ALARMS_DIR):\n        return alarms\n    now = time.time()\n    for name in sorted(os.listdir(ALARMS_DIR)):\n        full = ALARMS_DIR + \"/\" + name\n        if _isdir(full):\n            continue\n        try:\n            target_time = float(name)\n        except ValueError:\n            continue\n        try:\n            with open(full) as f:\n                content = f.read().strip()\n        except Exception:\n            continue\n        lines = content.split(\"\\n\", 1)\n        if len(lines) == 2:\n            channel, msg = lines\n        else:\n            channel, msg = \"terminal\", content\n        trigger_str = _fmt_time(target_time)\n        delta = target_time - now\n        if delta \u003e 0:\n            if delta \u003e= 86400:\n                remaining = \"{:.0f}d {:.0f}h\".format(delta / 86400, (delta % 86400) / 3600)\n            elif delta \u003e= 3600:\n                remaining = \"{:.0f}h {:.0f}m\".format(delta / 3600, (delta % 3600) / 60)\n            else:\n                remaining = \"{:.0f}m\".format(delta / 60)\n        else:\n            remaining = \"OVERDUE\"\n        alarms.append({\n            \"trigger\": trigger_str,\n            \"channel\": channel,\n
