const OLD_WEBSEARCH_STUB = "import json\n\nDESCRIPTION = \"Search the web. Returns JSON array of results with title, url, snippet.\"\n\ndef run(query, max_results=10):\n    max_results = int(max_results)\n    # MicroPython environment has no networking modules (no urllib, socket, ssl, requests)\n    return json.dumps([{\n        \"title\": \"Web search unavailable\",\n        \"url\": \"\",\n        \"snippet\": \"No networking modules available in this environment (no urllib/socket/ssl/requests). Query was: \" + str(query)\n    }])\n";
const NEW_WEBSEARCH_TOOL = "import json\nimport js\n\nDESCRIPTION = \"Search the web. Returns JSON array of results with title, url, snippet.\"\n\nasync def run(query, max_results=10):\n    query = str(query).strip()\n    if not query:\n        raise ValueError(\"query must not be empty\")\n\n    max_results = max(1, min(20, int(max_results)))\n\n    # DuckDuckGo's HTML endpoint gives normal server-rendered search results.\n    target = (\n        \"https://html.duckduckgo.com/html/?q=\"\n        + str(js.encodeURIComponent(query))\n    )\n\n    # Direct DuckDuckGo fetch is normally blocked by browser CORS, so fetch the\n    # raw HTML through a CORS-capable proxy. No Python networking modules needed.\n    proxy_urls = [\n        \"https://api.codetabs.com/v1/proxy?quest=\"\n        + str(js.encodeURIComponent(target)),\n        \"https://api.allorigins.win/raw?url=\"\n        + str(js.encodeURIComponent(target)),\n    ]\n\n    html = None\n    errors = []\n    for proxy_url in proxy_urls:\n        try:\n            response = await js.fetch(proxy_url)\n            if response.ok:\n                html = str(await response.text())\n                if html:\n                    break\n            else:\n                errors.append(\"HTTP \" + str(response.status))\n        except Exception as error:\n            errors.append(str(error))\n\n    if not html:\n        raise RuntimeError(\n            \"web search fetch failed: \" + \"; \".join(errors)\n        )\n\n    # Parse the real DDG result DOM in JavaScript; this avoids BeautifulSoup,\n    # html.parser, urllib, requests, sockets, etc.\n    document = js.DOMParser.new().parseFromString(html, \"text/html\")\n    nodes = document.querySelectorAll(\".result\")\n    results = []\n    seen = set()\n\n    for index in range(int(nodes.length)):\n        if len(results) \u003e= max_results:\n            break\n\n        node = nodes.item(index)\n        anchor = node.querySelector(\".result__a\")\n        if anchor is None:\n            continue\n\n        title = str(anchor.textContent or \"\").strip()\n        href = str(anchor.getAttribute(\"href\") or \"\").strip()\n        if not title or not href:\n            continue\n\n        # Skip DuckDuckGo ad/tracking links.\n        if \"duckduckgo.com/aclick\" in href or \"duckduckgo.com/y.js\" in href:\n            continue\n\n        # DDG usually wraps result URLs as /l/?uddg=\u003creal-url\u003e.\n        try:\n            parsed = js.URL.new(href, target)\n            real_url = parsed.searchParams.get(\"uddg\")\n            if real_url is not None and str(real_url):\n                href = str(real_url)\n            else:\n                href = str(parsed.href)\n        except Exception:\n            pass\n\n        if not href.startswith(\"http\"):\n            continue\n        if href in seen:\n            continue\n\n        snippet_node = node.querySelector(\".result__snippet\")\n        snippet = (\n            str(snippet_node.textContent or \"\").strip()\n            if snippet_node is not None\n            else \"\"\n        )\n\n        seen.add(href)\n        results.append({\n            \"title\": title,\n            \"url\": href,\n            \"snippet\": snippet,\n        })\n\n    if not results:\n        raise RuntimeError(\"search returned no parseable results\")\n\n    return json.dumps(results)\n";

else {
  // Render an existing imported transcript without creating/migrating files.
  if(exists(CHAT_PATH)) {
    try {
      for(const line of read(CHAT_PATH).split('\n')) {
        if(!line.trim()) continue;
        const item = JSON.parse(line);
        if((item.role === 'user' || item.role === 'iter') && typeof item.text === 'string')
          addChat(item.role, item.text, item.channel || 'terminal', false);

      console.warn('imported chat transcript restore failed', e);
    }

};

async function submitChat() {
  const line=chatInput.value.trim();
  if(!line) return;
  chatInput.value='';
  addChat('user', line, 'terminal');
  inbox.push(line);

  // Sending a chat message should be enough to wake/start Iter.
  if(!iterRunning) startIter();
  chatInput.focus();
}

sendChat.onclick=submitChat;
chatInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey) {
    e.preventDefault();
    submitChat();
  }
});

terminalInput.addEventListener('keydown', async e=>{
  if(e.key==='ArrowUp') {
    if(!terminalHistory.length) return;
    e.preventDefault();

    if(terminalHistoryIndex === terminalHistory.length)
      terminalHistoryDraft = terminalInput.value;

    if(terminalHistoryIndex > 0)
      terminalHistoryIndex--;

    terminalInput.value = terminalHistory[terminalHistoryIndex] || '';
    terminalInput.setSelectionRange(terminalInput.value.length, terminalInput.value.length);
    return;
  }

  if(e.key==='ArrowDown') {
    if(!terminalHistory.length) return;
    e.preventDefault();

    if(terminalHistoryIndex < terminalHistory.length)
      terminalHistoryIndex++;

    terminalInput.value =
      terminalHistoryIndex === terminalHistory.length
        ? terminalHistoryDraft
        : terminalHistory[terminalHistoryIndex];

    terminalInput.setSelectionRange(terminalInput.value.length, terminalInput.value.length);
    return;
  }

  if(e.key!=='Enter') return;
  const command=terminalInput.value;
  terminalInput.value='';

  if(!command.trim()) {
    terminalOut('\n$ ');
    return;
  }

  if(terminalHistory[terminalHistory.length - 1] !== command) {
    terminalHistory.push(command);
    if(terminalHistory.length > 100)
      terminalHistory = terminalHistory.slice(-100);
  }
  terminalHistoryIndex = terminalHistory.length;
  terminalHistoryDraft = '';
  saveUiState();

  terminalOut(command + '\n');
  try {
    const result=await runBash(command,false);
    if(result) terminalOut(result);
  } catch(e) {
    terminalOut(String(e?.message??e)+'\n');
  }
  terminalOut('$ ');
  scheduleFileRefresh();
  terminalInput.focus();
});
